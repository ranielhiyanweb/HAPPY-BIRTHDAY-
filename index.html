        lucide.createIcons();

        const VIDEO_URLS = [
            "/video/video6.mp4",
            "/video/relapse.mp4"
        ];

        const screens = {
            greeting: document.getElementById('screen-greeting'),
            loading:  document.getElementById('screen-loading'),
            video:    document.getElementById('screen-video')
        };
        const videoEl = document.getElementById('surprise-video');

        function showScreen(name) {
            Object.entries(screens).forEach(([key, el]) => {
                el.classList.toggle('hidden', key !== name);
                if (key === name) { el.classList.remove('screen'); void el.offsetWidth; el.classList.add('screen'); }
            });
        }

        function pickRandomVideo() {
            return VIDEO_URLS[Math.floor(Math.random() * VIDEO_URLS.length)];
        }

        function revealVideo() {
            videoEl.pause();
            videoEl.src = pickRandomVideo();
            videoEl.load();
            showScreen('video');
            const play = videoEl.play();
            if (play && play.catch) play.catch(() => {}); // ignore autoplay block; controls remain
            lucide.createIcons();
        }

        function startLetter() {
            showScreen('loading');
            setTimeout(revealVideo, 4000); // fake "opening the letter" delay
        }

        function playAnother() {
            videoEl.pause();
            showScreen('loading');
            setTimeout(revealVideo, 4000);
        }

        /* Build floating confetti dots */
        (function buildConfetti() {

                d.style.height = size + 'px';
                d.style.left = Math.random() * 100 + '%';
                d.style.bottom = (-10 - Math.random() * 30) + 'px';
                d.style.background = colors[Math.floor(Math.random() * colors.length)];
                d.style.animationDuration = (5 + Math.random() * 6) + 's';
                d.style.animationDelay = (Math.random() * 6) + 's';
                layer.appendChild(d);
            }
        })();
